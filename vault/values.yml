ui:
  enabled: true
  serviceType: NodePort
  serviceNodePort: 30843

injector:
  enabled: false

server:
  dataStorage:
    storageClass: local-path-provisioner-hdd

  ingress:
    enabled: false

  # Tailnet only, through Envoy's tailnet listener
  httproute:
    enabled: true
    hostnames:
      - vault.talos.tailnet.secondhomelab.com
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: eg
        namespace: envoy-gateway-system
        sectionName: tailnet

  # Single-server Raft (integrated storage), migrated from file storage on 2026-09-26
  ha:
    enabled: true
    replicas: 1
    disruptionBudget:
      enabled: false # 1 replica => the chart's PDB allows 0 disruptions and blocks node drains
    raft:
      enabled: true
      setNodeId: true # Raft node ID = pod name (vault-0)
