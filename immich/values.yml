controllers:
  main:
    containers:
      main:
        image:
          tag: v3.4.1
        env:
          DB_HOSTNAME: postgresql.postgresql
          DB_DATABASE_NAME: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: env
                key: DB_USERNAME
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: env
                key: DB_PASSWORD

immich:
  persistence:
    library:
      existingClaim: data

valkey:
  enabled: true

server:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          resources:
            requests:
              memory: 512Mi
              cpu: 25m
            limits:
              memory: 4Gi
              cpu: 1000m

# Was scaled to 0 replicas before the move to the chart
machine-learning:
  enabled: false
