apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: Immich
    gethomepage.dev/icon: immich
    gethomepage.dev/group: WAN
    gethomepage.dev/pod-selector: app.kubernetes.io/name=server
spec:
  hostnames:
    - immich.secondhomelab.com
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
