apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-externalsecret
  namespace: test
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: test-secret-from-vault
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: testsecret
