# Plain-directory apps: one Application per element, all with the same spec.
# Helm-based apps keep their own file in applications/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting the ApplicationSet keeps the apps' resources in the cluster
    preserveResourcesOnDeletion: true
  generators:
    - list:
        # path and namespace default to name
        elements:
          - name: frigate
          - name: grafana
          - name: homeassistant
          - name: homepage
          - name: immich
          - name: n8n
          - name: nextcloud
          - name: postgresql
          - name: vault-snapshot
          - name: apcupsd-exporter
            path: monitoring/apcupsd-exporter
            namespace: monitoring
          - name: gatus
            path: monitoring/gatus
            namespace: monitoring
          - name: node-exporter
            path: monitoring/node-exporter
            namespace: monitoring
          - name: openport-exporter
            path: monitoring/openport-exporter
            namespace: monitoring
          - name: prometheus
            path: monitoring/prometheus
            namespace: monitoring
          - name: snmp-exporter
            path: monitoring/snmp-exporter
            namespace: monitoring
          - name: cloudflared
            path: cloudflare
            namespace: cloudflare
          - name: openkintai
            path: moreillon/openkintai
            namespace: moreillon
          - name: discord2webhook
            path: moreillon/discord2webhook
            namespace: moreillon
          - name: okf-mcp
            path: moreillon/okf-mcp
            namespace: moreillon
          - name: pocket-id
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/secondhomelab/k8s.git
        path: '{{ index . "path" | default .name }}'
        targetRevision: HEAD
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index . "namespace" | default .name }}'
      syncPolicy:
        automated:
          enabled: true
          prune: false
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
