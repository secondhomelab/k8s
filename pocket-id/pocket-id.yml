apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: pocket-id
spec:
  storageClassName: local-path-provisioner-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      containers:
        - name: pocket-id
          image: pocketid/pocket-id:v2
          env:
            - name: APP_URL
              value: https://pocket-id.secondhomelab.com
          envFrom:
            - secretRef:
                name: env
          volumeMounts:
            - mountPath: /data
              name: data
          resources: {}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pocket-id
  ports:
    - port: 1411
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  namespace: pocket-id
  annotations:
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: pocket-id
    gethomepage.dev/icon: pocket-id
    gethomepage.dev/group: WAN

spec:
  hostnames:
    - pocket-id.secondhomelab.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: pocket-id
          port: 1411
      matches:
        - path:
            type: PathPrefix
            value: /
