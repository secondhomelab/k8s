global:
  envFrom:
    - secretRef:
        name: env

authentik:
  postgresql:
    host: postgresql.postgresql
    name: authentik
  env:
    # Forces Gunicorn to run only 1 process, saving ~150Mi-250Mi on the server pod
    - name: AUTHENTIK_WEB__WORKERS
      value: "1" # < 2 is not recommended

    # Keeps background worker processes at baseline
    - name: AUTHENTIK_WORKER__PROCESSES
      value: "1"

    # Lowers concurrent worker threads to 1 for sequential task processing
    - name: AUTHENTIK_WORKER__THREADS
      value: "1"

postgresql:
  enabled: false

server:
  resources:
    requests:
      cpu: 10m
      memory: 600Mi
    limits:
      cpu: 300m
      memory: 850Mi

worker:
  resources:
    requests:
      cpu: 10m
      memory: 350Mi
    limits:
      # 200m throttled "ak healthcheck" past its 3 s liveness timeout when the
      # worker was busy (16 restarts by 2026-11-06)
      cpu: "1"
      memory: 500Mi
