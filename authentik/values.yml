global:
  envFrom:
    - secretRef:
        name: env

authentik:
  postgresql:
    host: postgresql.postgresql
    name: authentik

postgresql:
  enabled: false

server:
  env:
    - name: AUTHENTIK_WEB__WORKERS
      value: "1"
  resources:
    requests:
      cpu: 10m
      memory: 600Mi
    limits:
      cpu: 300m
      memory: 850Mi

worker:
  env:
    - name: AUTHENTIK_WORKER__CONCURRENCY
      value: "1"
  resources:
    requests:
      cpu: 10m
      memory: 350Mi
    limits:
      cpu: 200m
      memory: 500Mi
