apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      # Bound to host ports 80/443 so tailnet hosts are reachable on the node's
      # Tailscale IP without a port.
      envoyDeployment:
        # A rolling update would deadlock: the new pod can't schedule while the
        # old one holds the hostPorts on the single node.
        strategy:
          type: Recreate
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      ports:
                        # Envoy Gateway listens on gateway port + 10000 for ports < 1024
                        - name: http-hostport
                          containerPort: 10080
                          hostPort: 80
                          protocol: TCP
                        - name: https-hostport
                          containerPort: 10443
                          hostPort: 443
                          protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS for tailnet-only hosts, restricted by tailnet-allowlist.
    # *.talos.tailnet.secondhomelab.com is a DNS-only Cloudflare record pointing
    # at the node's Tailscale IP. Routes must set sectionName: tailnet.
    # Plain HTTP requests for these hosts go to tailnet-http below.
    - name: tailnet
      protocol: HTTPS
      port: 443
      hostname: "*.talos.tailnet.secondhomelab.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-tailnet-tls
      allowedRoutes:
        namespaces:
          from: All
    # Plain HTTP for the same hosts, only redirected to HTTPS by
    # tailnet-https-redirect, and also restricted by tailnet-allowlist.
    - name: tailnet-http
      protocol: HTTP
      port: 80
      hostname: "*.talos.tailnet.secondhomelab.com"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eg
    namespace: envoy-gateway-system
