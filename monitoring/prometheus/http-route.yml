apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  hostnames:
    - prometheus.talos.tailnet.secondhomelab.com
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      # Tailnet hosts are plain HTTP and covered by the tailnet-allowlist policy
      sectionName: tailnet
  rules:
    - backendRefs:
        - name: prometheus
          port: 9090
      matches:
        - path:
            type: PathPrefix
            value: /
