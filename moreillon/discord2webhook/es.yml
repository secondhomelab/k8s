apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord2webhook-env
  namespace: moreillon
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: discord2webhook-env
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: discord2webhook
