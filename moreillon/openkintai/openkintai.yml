apiVersion: apps/v1
kind: Deployment
metadata:
  name: openkintai
  namespace: moreillon
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openkintai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openkintai
    spec:
      containers:
        - name: openkintai
          image: moreillon/openkintai:sha-00eb2ab
          resources:
            requests:
              memory: 128Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 500m
          envFrom:
            - secretRef:
                name: openkintai-env
---
apiVersion: v1
kind: Service
metadata:
  name: openkintai
  namespace: moreillon
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: openkintai
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openkintai
  namespace: moreillon

spec:
  hostnames:
    - openkintai.secondhomelab.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: openkintai
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
